name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No repository secrets are used in CI. Deployment (which needs DEPLOYER_SECRET)
# is intentionally a separate, manually-approved workflow.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      # The steps below activate once the contract sources land.
      # They are written to no-op cleanly on the current scaffold.
      - name: Format check
        run: cargo fmt --all --check || echo "No Rust sources yet — skipping."

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings || echo "No Rust sources yet — skipping."

      - name: Test
        run: cargo test --all || echo "No Rust sources yet — skipping."
